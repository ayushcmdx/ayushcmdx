<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <!-- Background Gradient: Deep Espresso to Atmospheric Dusk -->
    <linearGradient id="bgDusk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19120F"/>
      <stop offset="45%" stop-color="#241B17"/>
      <stop offset="85%" stop-color="#1A1310"/>
      <stop offset="100%" stop-color="#120D0B"/>
    </linearGradient>

    <!-- Outer Border Gradient: Sand Gold into Electric Blue & Lavender -->
    <linearGradient id="outerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A77B" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#8D6748" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#69B7FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B9A5FF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Title Gradient: Sandy Beige -> Warm Sand -> Soft Cyan -> Electric Blue -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6D2B5"/>
      <stop offset="30%" stop-color="#E6D2B5"/>
      <stop offset="55%" stop-color="#C8A77B"/>
      <stop offset="80%" stop-color="#83E5E0"/>
      <stop offset="100%" stop-color="#69B7FF"/>
    </linearGradient>

    <!-- Cyber Ridge Wave: Electric Blue -> Lavender -> Cyan -->
    <linearGradient id="cyberRidgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69B7FF" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#69B7FF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#B9A5FF" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#83E5E0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C8A77B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Pill Border Gradient -->
    <linearGradient id="pillBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69B7FF"/>
      <stop offset="50%" stop-color="#B9A5FF"/>
      <stop offset="100%" stop-color="#83E5E0"/>
    </linearGradient>

    <!-- Dune Gradients -->
    <linearGradient id="duneBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2820"/>
      <stop offset="100%" stop-color="#1F1511"/>
    </linearGradient>

    <linearGradient id="duneMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3F2F"/>
      <stop offset="50%" stop-color="#4A3125"/>
      <stop offset="100%" stop-color="#241B17"/>
    </linearGradient>

    <linearGradient id="duneFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8D6748"/>
      <stop offset="40%" stop-color="#735137"/>
      <stop offset="100%" stop-color="#36251D"/>
    </linearGradient>

    <linearGradient id="sandGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A77B" stop-opacity="0"/>
      <stop offset="40%" stop-color="#E6D2B5" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#C8A77B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8D6748" stop-opacity="0"/>
    </linearGradient>

    <!-- Atmospheric Radial Glows -->
    <radialGradient id="sunsetGlow" cx="50%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#8D6748" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#C8A77B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#241B17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAura" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#83E5E0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#83E5E0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lavenderAura" cx="85%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#B9A5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#B9A5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueDusk" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#69B7FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#69B7FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Texture Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#83E5E0" flood-opacity="0.25"/>
    </filter>

    <!-- Subtle Dot Matrix Background Grid -->
    <pattern id="sandGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#C8A77B" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .star-twinkle {
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    .ridge-pulse {
      animation: ridgeGlow 6s ease-in-out infinite alternate;
    }
    .pulse-dot {
      animation: dotPulse 2.5s ease-in-out infinite;
    }
    .float-slow {
      animation: floatMotion 8s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
    @keyframes ridgeGlow {
      0% { filter: drop-shadow(0 0 3px rgba(105, 183, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 8px rgba(185, 165, 255, 0.6)); }
      100% { filter: drop-shadow(0 0 4px rgba(131, 229, 224, 0.5)); }
    }
    @keyframes dotPulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
    @keyframes floatMotion {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .star-twinkle, .ridge-pulse, .pulse-dot, .float-slow {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  </style>

  <!-- Base Canvas Background -->
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#bgDusk)"/>

  <!-- Atmospheric Nebulae & Radial Glows -->
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#sunsetGlow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#cyanAura)"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#lavenderAura)"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#blueDusk)"/>

  <!-- Subtle Digital Matrix Mesh -->
  <rect x="1" y="1" width="1198" height="240" rx="18" fill="url(#sandGrid)"/>

  <!-- Outer Luxury Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="17.5" fill="none" stroke="url(#outerBorderGrad)" stroke-width="1.5"/>

  <!-- Celestial Constellation Stars & Sparkles -->
  <g class="float-slow">
    <!-- Star 1 (Cyan diamond sparkle) -->
    <path class="star-twinkle" style="transform-origin: 140px 95px; animation-delay: 0s;"
          d="M 140 85 Q 140 95 150 95 Q 140 95 140 105 Q 140 95 130 95 Q 140 95 140 85 Z" fill="#83E5E0" opacity="0.85"/>
    <circle cx="140" cy="95" r="1.5" fill="#FFFFFF"/>

    <!-- Star 2 (Lavender sparkle) -->
    <path class="star-twinkle" style="transform-origin: 1060px 85px; animation-delay: 1.5s;"
          d="M 1060 77 Q 1060 85 1068 85 Q 1060 85 1060 93 Q 1060 85 1052 85 Q 1060 85 1060 77 Z" fill="#B9A5FF" opacity="0.8"/>
    <circle cx="1060" cy="85" r="1.2" fill="#FFFFFF"/>

    <!-- Star 3 (Sandy beige star) -->
    <path class="star-twinkle" style="transform-origin: 260px 150px; animation-delay: 2.2s;"
          d="M 260 144 Q 260 150 266 150 Q 260 150 260 156 Q 260 150 254 150 Q 260 150 260 144 Z" fill="#E6D2B5" opacity="0.75"/>

    <!-- Star 4 (Electric blue star) -->
    <path class="star-twinkle" style="transform-origin: 940px 160px; animation-delay: 0.8s;"
          d="M 940 153 Q 940 160 947 160 Q 940 160 940 167 Q 940 160 933 160 Q 940 160 940 153 Z" fill="#69B7FF" opacity="0.85"/>

    <!-- Smaller Micro Stars -->
    <circle cx="190" cy="180" r="1.2" fill="#83E5E0" opacity="0.6"/>
    <circle cx="340" cy="80" r="1" fill="#C8A77B" opacity="0.5"/>
    <circle cx="860" cy="95" r="1.4" fill="#B9A5FF" opacity="0.6"/>
    <circle cx="1010" cy="140" r="1" fill="#69B7FF" opacity="0.5"/>
  </g>

  <!-- ================= DESERT SAND DUNES ARCHITECTURE ================= -->

  <!-- Dune 1: Deep Back Dune Silhouette -->
  <path d="M 0 255 C 240 215 480 265 740 230 C 960 200 1100 235 1200 218 L 1200 358 L 0 358 Z"
        fill="url(#duneBack)"/>

  <!-- Dune 2: Warm Sand Mid Dune with Natural Horizon Flow -->
  <path d="M 0 290 C 280 230 580 290 880 245 C 1040 220 1140 260 1200 245 L 1200 358 L 0 358 Z"
        fill="url(#duneMid)"/>
  
  <!-- Subtle Ridge Highlight on Mid Dune -->
  <path d="M 0 290 C 280 230 580 290 880 245 C 1040 220 1140 260 1200 245"
        fill="none" stroke="#C8A77B" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Dune 3: Foreground Sand Dune Sweep -->
  <path d="M 120 358 C 360 275 660 330 940 280 C 1070 255 1160 285 1200 280 L 1200 358 Z"
        fill="url(#duneFront)"/>

  <!-- Warm Sand Edge Rim on Foreground Dune -->
  <path d="M 120 358 C 360 275 660 330 940 280 C 1070 255 1160 285 1200 280"
        fill="none" stroke="url(#sandGlowGrad)" stroke-width="2"/>

  <!-- Modern Luminous Cyber Ridge: Flowing Electric Blue & Cyan Wave Line -->
  <path class="ridge-pulse"
        d="M -20 275 C 260 195 540 295 820 225 C 990 185 1110 245 1220 220"
        fill="none" stroke="url(#cyberRidgeGrad)" stroke-width="2.5"/>

  <!-- Geometric Horizon Compass Marks (Subtle Digital Meridian Ticks) -->
  <g opacity="0.35" stroke="#C8A77B" stroke-width="1">
    <line x1="600" y1="218" x2="600" y2="230"/>
    <line x1="560" y1="222" x2="560" y2="228"/>
    <line x1="640" y1="222" x2="640" y2="228"/>
    <line x1="520" y1="224" x2="520" y2="227"/>
    <line x1="680" y1="224" x2="680" y2="227"/>
  </g>

  <!-- ================= TYPOGRAPHY & INTERFACE MOTIF ================= -->

  <!-- Top Status Badge Pill -->
  <g transform="translate(600, 52)">
    <rect x="-175" y="-14" width="350" height="28" rx="14"
          fill="#1C1410" fill-opacity="0.9" stroke="#8D6748" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Terminal Aesthetic Mini Dots -->
    <circle cx="-150" cy="0" r="4" fill="#83E5E0" class="pulse-dot" style="transform-origin: -150px 0px;"/>
    <circle cx="-136" cy="0" r="3.5" fill="#B9A5FF" opacity="0.8"/>
    <circle cx="-123" cy="0" r="3.5" fill="#E6D2B5" opacity="0.8"/>

    <!-- Status Text -->
    <text x="14" y="4.5" fill="#E6D2B5" font-size="11.5" font-weight="600" letter-spacing="1.5" text-anchor="middle">
      AYUSHCMDX // SECONDARY PROFILE NODE
    </text>
  </g>

  <!-- Main Prominent Heading: SECONDARY GITHUB ACCOUNT -->
  <text x="600" y="142" text-anchor="middle"
        fill="url(#titleGrad)" font-size="36" font-weight="800" letter-spacing="3.5"
        filter="url(#titleGlow)">
    SECONDARY GITHUB ACCOUNT
  </text>

  <!-- Supporting Subtitle Line -->
  <text x="600" y="180" text-anchor="middle"
        fill="#C8A77B" font-size="16.5" font-weight="500" letter-spacing="1.8">
    A little side quest in my developer journey.
  </text>

  <!-- Destination Cue Terminal Chip -->
  <g transform="translate(600, 248)">
    <!-- Pill Container -->
    <rect x="-225" y="-21" width="450" height="42" rx="21"
          fill="#160F0C" fill-opacity="0.92" stroke="url(#pillBorderGrad)" stroke-width="1.5"/>

    <!-- Inner Content -->
    <text x="0" y="6" text-anchor="middle" font-size="13" font-weight="500">
      <tspan fill="#69B7FF" font-weight="700">~ $ </tspan>
      <tspan fill="#E6D2B5">main profile: </tspan>
      <tspan fill="#83E5E0" font-weight="700">github.com/ayushcmd</tspan>
      <tspan fill="#B9A5FF" font-weight="700"> ↗</tspan>
    </text>
  </g>
</svg>
